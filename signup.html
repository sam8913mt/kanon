<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ثبت‌نام و ورود | کانون نخبه‌پروری رویش</title><meta name="description" content="ساخت پروفایل و ورود به حساب کاربری"><meta name="robots" content="noindex"><meta name="theme-color" content="#243B64">
<link rel="icon" href="assets/logo.png"><script src="js/theme.js"></script><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages/member.css"><link rel="stylesheet" href="css/fun.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body><div id="hdr"></div>
<main id="main">
<section><div class="wrap">
<div class="tabs" role="tablist"><button type="button" class="btn" id="t-up" role="tab" aria-selected="true">ساخت پروفایل</button><button type="button" class="btn alt" id="t-in" role="tab" aria-selected="false">ورود</button></div>
<form class="f" id="f" novalidate>
<h1 id="ttl" style="text-align:center;font-size:22px">ساخت پروفایل</h1>
<div id="nm"><label for="fn">نام</label><input id="fn" autocomplete="given-name" maxlength="60"><label for="ln">نام خانوادگی</label><input id="ln" autocomplete="family-name" maxlength="60"></div>
<label for="m">شماره موبایل</label><input id="m" type="tel" inputmode="tel" dir="ltr" placeholder="09123456789" autocomplete="username" maxlength="11">
<label for="p">گذرواژه (حداقل ۸ کاراکتر)</label><input id="p" type="password" autocomplete="new-password">
<p class="err" id="e" role="alert"></p><button class="btn block" id="sb">ساخت پروفایل</button>
</form></div></section>
</main>
<noscript><p style="text-align:center">برای مشاهده‌ی این صفحه جاوااسکریپت را فعال کنید.</p></noscript>
<div id="ftr"></div>
<script src="js/config.js"></script><script src="js/demo-data.js"></script><script src="js/api.js"></script><script src="js/seo.js"></script><script src="js/components.js"></script><script src="js/app.js"></script><script src="js/validation.js"></script><script src="js/pages/signup.js"></script>
